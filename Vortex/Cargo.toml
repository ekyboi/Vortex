[package]
name = "vortex"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Hardware-aligned zero-copy SPSC ingestion engine over page-locked, off-heap mmap arenas"
license = "MIT"
repository = "https://github.com/ekyboi/Vortex"
readme = "README.md"
keywords = ["zero-copy", "spsc", "kernel-bypass", "mmap", "dma"]
categories = ["concurrency", "memory-management", "network-programming"]

[dependencies]
libc = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
